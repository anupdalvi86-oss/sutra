name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect code changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$base_sha" "$GITHUB_SHA" <<'PY'
          import os
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", sys.argv[1], sys.argv[2]], text=True
          ).splitlines()
          docs_only_paths = {"README.md", "STATUS.md"}
          code_changed = any(
              path not in docs_only_paths
              and not (path.startswith("docs/") and path.endswith(".md"))
              for path in changed
          )
          print(f"code={'true' if code_changed else 'false'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={'true' if code_changed else 'false'}\n")
          PY

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q sutra tests
      - name: Python security analysis
        run: |
          python -m pip install --disable-pip-version-check bandit==1.9.4
          python -m bandit -r sutra -ll

  database:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.118.0
      - name: Start local Auth/PostgREST stack and apply migrations
        run: |
          umask 077
          # Service-specific integration and SQL checks below determine readiness;
          # unrelated local containers must not block those checks at startup.
          supabase start --exclude realtime,storage-api,imgproxy,mailpit,studio,postgres-meta,edge-runtime,logflare,vector,supavisor --ignore-health-check > "$RUNNER_TEMP/sutra-supabase-start.log" 2>&1
          python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(["supabase", "status", "--output", "json"], capture_output=True, text=True, check=True)
          output = result.stdout[result.stdout.find("{"):]
          status = json.loads(output)
          assert status.get("API_URL", "").startswith("http://127.0.0.1:"), "local API URL missing"
          assert status.get("ANON_KEY") and status.get("SERVICE_ROLE_KEY"), "local Auth keys missing"
          print("Local Supabase Auth and Data API are available")
          PY
      - name: Supabase Auth, RLS, and Sutra draft API integration
        run: python3 scripts/draft_auth_e2e.py
      - name: SQL policy tests
        run: supabase test db
      - name: Database lint
        run: supabase db lint --local --level error

  containers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Sutra API image
        run: docker build -f Dockerfile.api -t sutra-api:ci .
      - name: Build Sutra API package-root image
        run: docker build -t sutra-api-package:ci ./sutra
      - name: Verify the pinned Codex runner runtime
        run: docker run --rm --entrypoint /bin/sh sutra-api-package:ci -ec 'codex --version; git --version'
      - name: Build Hermes image
        run: docker build -f Dockerfile -t sutra-hermes:ci .
      - name: Verify Hermes startup bounds
        run: |
          docker run --rm --entrypoint /bin/sh sutra-hermes:ci -ec '
            export HERMES_HOME=/tmp/sutra-startup-test
            mkdir -p "$HERMES_HOME"
            printf "API_SERVER_KEY=stale-volume-value\nRETAINED_PROVIDER_SETTING=yes\n" > "$HERMES_HOME/.env"
            cat > "$HERMES_HOME/config.yaml" <<EOF
          agent:
            max_turns: unlimited
            api_max_retries: 5
            auto_recovery_cycles: 5
          platforms:
            api_server:
              enabled: true
          platform_toolsets:
            api_server: [shell]
          retained_setting: true
          EOF
            printf "existing identity\n" > "$HERMES_HOME/SOUL.md"
            sh /etc/cont-init.d/30-sutra-seed-soul
            python3 - "$HERMES_HOME/config.yaml" "$HERMES_HOME/SOUL.md" <<PY
          import sys, yaml
          config = yaml.safe_load(open(sys.argv[1]))
          assert config["agent"] == {"max_turns": 3, "api_max_retries": 1, "auto_recovery_cycles": 0}
          assert config["platform_toolsets"]["api_server"] == ["web"]
          from hermes_cli.tools_config import _get_platform_tools
          from tools.registry import discover_builtin_tools
          discover_builtin_tools()
          resolved_api_toolsets = _get_platform_tools(config, "api_server")
          assert set(resolved_api_toolsets) == {"web"}, resolved_api_toolsets
          assert config["platforms"]["api_server"]["enabled"] is False
          assert config["retained_setting"] is True
          assert open(sys.argv[2]).read() == "existing identity\\n"
          dotenv = open(sys.argv[1].replace("config.yaml", ".env")).read()
          assert "API_SERVER_KEY=" not in dotenv
          assert "RETAINED_PROVIDER_SETTING=yes" in dotenv
          PY
          '
      - name: Verify Hermes API server explicit opt-in
        run: |
          docker run --rm --entrypoint /bin/sh -e SUTRA_HERMES_API_ENABLED=true sutra-hermes:ci -ec '
            export HERMES_HOME=/tmp/sutra-api-enabled-test
            mkdir -p "$HERMES_HOME"
            sh /etc/cont-init.d/30-sutra-seed-soul
            python3 - "$HERMES_HOME/config.yaml" <<PY
          import sys, yaml
          config = yaml.safe_load(open(sys.argv[1]))
          assert config["platforms"]["api_server"]["enabled"] is True
          PY
          '
      - name: Verify Hermes model spend request controls
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python sutra-hermes:ci -c '
          import inspect
          from gateway.platforms.api_server import APIServerAdapter, _request_agent_overrides
          from run_agent import AIAgent
          request = {"provider": "openai", "model": "gpt-6-luna", "max_tokens": 734, "require_model_lock": True,
                     "model_options": {"response_format": {"type": "json_object"}}}
          overrides = _request_agent_overrides(request, virtual_model="hermes-agent")
          assert overrides["max_tokens"] == 734
          assert overrides["requested_provider"] == "openai"
          assert overrides["requested_model"] == "gpt-6-luna"
          assert overrides["model_options"] == {"response_format": {"type": "json_object"}}
          assert overrides["confirmed_runtime_lock"] is True
          try:
              _request_agent_overrides({**request, "max_tokens": 0}, virtual_model="hermes-agent")
          except ValueError:
              pass
          else:
              raise AssertionError("malformed output token caps must be rejected")
          assert "max_tokens" in inspect.signature(AIAgent.__init__).parameters
          assert "max_tokens" in inspect.signature(APIServerAdapter._create_agent).parameters
          assert "max_tokens" in inspect.signature(APIServerAdapter._run_agent).parameters
          print("Hermes exact-route lock and output token cap verified")
          '

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/src" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/src --no-git --redact --exit-code 1
