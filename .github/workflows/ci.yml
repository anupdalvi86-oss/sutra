name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q sutra tests

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.118.0
      - name: Start local Postgres and apply migrations
        run: supabase db start
      - name: SQL policy tests
        run: supabase test db
      - name: Database lint
        run: supabase db lint --local --level error

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Sutra API image
        run: docker build -f Dockerfile.api -t sutra-api:ci .
      - name: Build Hermes image
        run: docker build -f Dockerfile -t sutra-hermes:ci .
      - name: Verify Hermes startup bounds
        run: |
          docker run --rm --entrypoint /bin/sh sutra-hermes:ci -ec '
            export HERMES_HOME=/tmp/sutra-startup-test
            mkdir -p "$HERMES_HOME"
            cat > "$HERMES_HOME/config.yaml" <<EOF
          agent:
            max_turns: unlimited
            api_max_retries: 5
            auto_recovery_cycles: 5
          platform_toolsets:
            api_server: [shell]
          retained_setting: true
          EOF
            printf "existing identity\n" > "$HERMES_HOME/SOUL.md"
            sh /etc/cont-init.d/30-sutra-seed-soul
            python3 -c "import sys,yaml; c=yaml.safe_load(open(sys.argv[1])); assert c['agent']=={'max_turns':3,'api_max_retries':1,'auto_recovery_cycles':0}; assert c['platform_toolsets']['api_server']==['web']; assert c['retained_setting'] is True; assert open(sys.argv[2]).read()=='existing identity\\n'" "$HERMES_HOME/config.yaml" "$HERMES_HOME/SOUL.md"
          '

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/src" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/src --no-git --redact --exit-code 1
